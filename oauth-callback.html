<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VPRAVA.ONLINE — Google sign-in</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/js/locale.js"></script>
  </head>
  <body>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var code = params.get("code");
        var error = params.get("error");
        var payload = code
          ? { type: "interval-timer-oauth", code: code }
          : { type: "interval-timer-oauth", error: error || "no_code" };
        if (window.opener) {
          window.opener.postMessage(payload, window.location.origin);
          window.close();
        } else {
          var locale = (window.AppLocale && AppLocale.resolveLocale()) || "en";
          var messages = {
            en: {
              fail: "Sign-in failed. Close this tab and try again from the timer app.",
              ok: "Sign-in complete. You can close this tab."
            },
            uk: {
              fail: "Не вдалося увійти. Закрийте цю вкладку й спробуйте знову в застосунку.",
              ok: "Вхід виконано. Можете закрити цю вкладку."
            },
            ru: {
              fail: "Не удалось войти. Закройте эту вкладку и попробуйте снова в приложении.",
              ok: "Вход выполнен. Можно закрыть эту вкладку."
            }
          };
          var pack = messages[locale] || messages.en;
          document.documentElement.lang = locale;
          document.body.textContent = error || !code ? pack.fail : pack.ok;
        }
      })();
    </script>
  </body>
</html>
